<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OffByOne — 注册 / 登录</title>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#0a0a0a;color:#e0e0e0;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
            -webkit-font-smoothing:antialiased;
            min-height:100vh;display:flex;align-items:center;justify-content:center;
        }

        .container{width:400px;padding:48px 40px}
        .logo{text-align:center;margin-bottom:40px}
        .logo h1{font-size:28px;font-weight:800;color:#fff;letter-spacing:-1px}
        .logo h1 span{color:#E53935}
        .logo p{font-size:13px;color:#666;margin-top:6px}

        /* Tabs */
        .tabs{display:flex;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:32px}
        .tab{flex:1;text-align:center;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;
              color:#555;border-bottom:2px solid transparent;transition:all 0.2s}
        .tab.active{color:#fff;border-bottom-color:#E53935}
        .tab:hover{color:#999}

        /* Form */
        .form{display:none}
        .form.active{display:block}

        .field{margin-bottom:20px}
        .field label{display:block;font-size:13px;color:#888;margin-bottom:8px;font-weight:500}
        .field input{
            width:100%;padding:14px 16px;background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.1);border-radius:8px;
            color:#fff;font-size:15px;outline:none;transition:border-color 0.2s
        }
        .field input:focus{border-color:#E53935}
        .field input::placeholder{color:#444}
        .field input:disabled{opacity:0.4;cursor:not-allowed}

        .code-row{display:flex;gap:12px}
        .code-row .field{flex:1;margin-bottom:0}
        .btn-code{
            white-space:nowrap;padding:0 20px;height:50px;background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.12);border-radius:8px;
            color:#ccc;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s
        }
        .btn-code:hover{background:rgba(255,255,255,0.1);color:#fff}
        .btn-code:disabled{opacity:0.35;cursor:not-allowed}
        .btn-code.counting{border-color:#E53935;color:#E53935}

        .btn-primary{
            width:100%;padding:14px;background:#E53935;color:#fff;border:none;
            border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;
            letter-spacing:1px;transition:all 0.2s;margin-top:8px
        }
        .btn-primary:hover{background:#c62828}
        .btn-primary:disabled{opacity:0.4;cursor:not-allowed}

        .msg{margin-top:16px;text-align:center;font-size:13px;min-height:20px}
        .msg.error{color:#E53935}
        .msg.success{color:#34A853}

        /* Dashboard after login */
        .dashboard{display:none;text-align:center}
        .dashboard.active{display:block}
        .greeting{font-size:22px;font-weight:700;color:#fff;margin-bottom:8px}
        .sub{font-size:14px;color:#777;margin-bottom:32px}

        .cred-card{
            background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);
            border-radius:12px;padding:28px;margin-bottom:24px;text-align:left
        }
        .cred-card h3{font-size:14px;color:#999;font-weight:500;margin-bottom:16px}
        .cred-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
                   border-bottom:1px solid rgba(255,255,255,0.05)}
        .cred-row:last-child{border:none}
        .cred-label{font-size:13px;color:#777}
        .cred-value{font-size:18px;font-weight:700;color:#fff;letter-spacing:4px;font-family:monospace}
        .cred-hint{font-size:12px;color:#555;margin-top:16px;text-align:center}

        .btn-outline{
            width:100%;padding:14px;background:transparent;color:#fff;
            border:1px solid rgba(255,255,255,0.2);border-radius:8px;
            font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;margin-top:8px
        }
        .btn-outline:hover{border-color:#fff;background:rgba(255,255,255,0.04)}

        .footer-link{text-align:center;margin-top:24px;font-size:12px;color:#555}
        .footer-link a{color:#E53935;text-decoration:none}
        .footer-link a:hover{text-decoration:underline}

        .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);
                 border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <h1>Off<span>By</span>One</h1>
        <p>SmartAgents 内测资格申请平台</p>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
        <div class="tab active" data-tab="register">注册</div>
        <div class="tab" data-tab="login">登录</div>
    </div>

    <!-- Register Form -->
    <div class="form active" id="form-register">
        <div class="field">
            <label>邮箱地址</label>
            <input type="email" id="reg-email" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="code-row">
            <div class="field">
                <label>验证码</label>
                <input type="text" id="reg-code" placeholder="6位数字" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
            </div>
            <button class="btn-code" id="btn-send-code" style="margin-top:26px">发送验证码</button>
        </div>
        <div class="field">
            <label>设置密码</label>
            <input type="password" id="reg-pwd" placeholder="至少 6 位" autocomplete="new-password">
        </div>
        <div class="field">
            <label>确认密码</label>
            <input type="password" id="reg-pwd2" placeholder="再次输入密码" autocomplete="new-password">
        </div>
        <button class="btn-primary" id="btn-register">注 册</button>
        <div class="msg" id="msg-register"></div>
    </div>

    <!-- Login Form -->
    <div class="form" id="form-login">
        <div class="field">
            <label>邮箱地址</label>
            <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="field">
            <label>密码</label>
            <input type="password" id="login-pwd" placeholder="输入密码" autocomplete="current-password">
        </div>
        <button class="btn-primary" id="btn-login">登 录</button>
        <div class="msg" id="msg-login"></div>
    </div>

    <!-- Dashboard (after login) -->
    <div class="dashboard" id="dashboard">
        <div class="greeting" id="dash-greeting"></div>
        <div class="sub">您已登录 OffByOne</div>
        <div class="cred-card" id="cred-card" style="display:none">
            <h3>🎯 SmartAgents 内测凭证</h3>
            <div class="cred-row">
                <span class="cred-label">用户名</span>
                <span class="cred-value" id="cred-user">----</span>
            </div>
            <div class="cred-row">
                <span class="cred-label">密　码</span>
                <span class="cred-value" id="cred-pass">----</span>
            </div>
            <div class="cred-hint">请在 SmartAgents 桌面端使用以上凭证登录</div>
        </div>
        <button class="btn-primary" id="btn-apply-beta">
            <span id="btn-apply-text">申请 SmartAgents 内测凭证</span>
        </button>
        <button class="btn-outline" id="btn-logout">退出登录</button>
    </div>

    <div class="footer-link">
        <a href="/">← 返回 SmartAgents 首页</a>
    </div>
</div>

<script>
const API = '/api/offbyone';

// ── Tab toggle ──
document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        const target = t.dataset.tab;
        document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
        document.getElementById('form-' + target).classList.add('active');
        document.getElementById('msg-register').textContent = '';
        document.getElementById('msg-login').textContent = '';
    });
});

// ── Send code with countdown ──
let codeTimer = null;
document.getElementById('btn-send-code').addEventListener('click', async () => {
    const email = document.getElementById('reg-email').value.trim();
    if (!email) { showMsg('register', '请输入邮箱地址', 'error'); return; }

    const btn = document.getElementById('btn-send-code');
    btn.disabled = true;
    btn.classList.add('counting');
    showMsg('register', '', '');

    try {
        const res = await fetch(API + '/send-code', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({email})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '发送失败');
        showMsg('register', '验证码已发送，请查收邮件', 'success');

        // 60s countdown
        let sec = 60;
        btn.textContent = sec + 's 后重发';
        codeTimer = setInterval(() => {
            sec--;
            btn.textContent = sec + 's 后重发';
            if (sec <= 0) {
                clearInterval(codeTimer);
                btn.disabled = false;
                btn.classList.remove('counting');
                btn.textContent = '发送验证码';
            }
        }, 1000);
    } catch (e) {
        showMsg('register', e.message, 'error');
        btn.disabled = false;
        btn.classList.remove('counting');
    }
});

// ── Register ──
document.getElementById('btn-register').addEventListener('click', async () => {
    const email = document.getElementById('reg-email').value.trim();
    const code = document.getElementById('reg-code').value.trim();
    const pwd = document.getElementById('reg-pwd').value;
    const pwd2 = document.getElementById('reg-pwd2').value;

    if (!email || !code || !pwd) { showMsg('register', '请填写所有字段', 'error'); return; }
    if (pwd.length < 6) { showMsg('register', '密码至少 6 位', 'error'); return; }
    if (pwd !== pwd2) { showMsg('register', '两次密码不一致', 'error'); return; }

    const btn = document.getElementById('btn-register');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>注册中...';
    showMsg('register', '', '');

    try {
        const res = await fetch(API + '/register', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({email, code, password: pwd})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '注册失败');

        // Auto login after register
        localStorage.setItem('ob_token', data.token);
        localStorage.setItem('ob_email', data.email);
        showDashboard(data.email, data.token, false);
    } catch (e) {
        showMsg('register', e.message, 'error');
        btn.disabled = false;
        btn.textContent = '注 册';
    }
});

// ── Login ──
document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const pwd = document.getElementById('login-pwd').value;
    if (!email || !pwd) { showMsg('login', '请填写邮箱和密码', 'error'); return; }

    const btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>登录中...';
    showMsg('login', '', '');

    try {
        const res = await fetch(API + '/login', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({email, password: pwd})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '登录失败');

        localStorage.setItem('ob_token', data.token);
        localStorage.setItem('ob_email', data.email);
        showDashboard(data.email, data.token, data.has_sa_credentials, data.sa_username);
    } catch (e) {
        showMsg('login', e.message, 'error');
        btn.disabled = false;
        btn.textContent = '登 录';
    }
});

// ── Apply beta ──
document.getElementById('btn-apply-beta').addEventListener('click', async () => {
    const token = localStorage.getItem('ob_token');
    if (!token) return;

    const btn = document.getElementById('btn-apply-beta');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>生成凭证中...';

    try {
        const res = await fetch(API + '/apply-beta', {
            method: 'POST', headers: {'Authorization': 'Bearer ' + token}
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '申请失败');

        document.getElementById('cred-user').textContent = data.username;
        document.getElementById('cred-pass').textContent = data.password;
        document.getElementById('cred-card').style.display = 'block';
        document.getElementById('btn-apply-text').textContent = data.already_had ? '已获取凭证（点击刷新）' : '申请 SmartAgents 内测凭证';
        btn.disabled = false;
        btn.innerHTML = document.getElementById('btn-apply-text').textContent;
    } catch (e) {
        alert(e.message);
        btn.disabled = false;
        btn.innerHTML = document.getElementById('btn-apply-text').textContent || '申请 SmartAgents 内测凭证';
    }
});

// ── Logout ──
document.getElementById('btn-logout').addEventListener('click', () => {
    localStorage.removeItem('ob_token');
    localStorage.removeItem('ob_email');
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('tabs').style.display = 'flex';
    document.querySelector('.tab[data-tab="register"]').click();
    document.getElementById('reg-email').value = '';
    document.getElementById('reg-code').value = '';
    document.getElementById('reg-pwd').value = '';
    document.getElementById('reg-pwd2').value = '';
    document.getElementById('login-email').value = '';
    document.getElementById('login-pwd').value = '';
    document.getElementById('cred-card').style.display = 'none';
    document.getElementById('btn-apply-text').textContent = '申请 SmartAgents 内测凭证';
});

// ── Helpers ──
function showMsg(form, msg, type) {
    const el = document.getElementById('msg-' + form);
    el.textContent = msg;
    el.className = 'msg ' + type;
}

function showDashboard(email, token, hasSA, saUsername) {
    document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('dashboard').classList.add('active');
    document.getElementById('dash-greeting').textContent = email;

    if (hasSA && saUsername) {
        // Already has credentials — fetch them
        fetch(API + '/apply-beta', {
            method: 'POST', headers: {'Authorization': 'Bearer ' + token}
        }).then(r => r.json()).then(data => {
            if (data.username) {
                document.getElementById('cred-user').textContent = data.username;
                document.getElementById('cred-pass').textContent = data.password;
                document.getElementById('cred-card').style.display = 'block';
                document.getElementById('btn-apply-text').textContent = '查看内测凭证';
            }
        }).catch(() => {});
    }
}

// ── Auto-restore session ──
(function(){
    const token = localStorage.getItem('ob_token');
    const email = localStorage.getItem('ob_email');
    if (token && email) {
        // Verify token is still valid
        fetch(API + '/apply-beta', {
            method: 'POST', headers: {'Authorization': 'Bearer ' + token}
        }).then(r => r.json()).then(data => {
            if (data.username || data.success !== false) {
                showDashboard(email, token, true, data.username);
            } else {
                localStorage.removeItem('ob_token');
                localStorage.removeItem('ob_email');
            }
        }).catch(() => {
            localStorage.removeItem('ob_token');
            localStorage.removeItem('ob_email');
        });
    }
})();
</script>

</body>
</html>
